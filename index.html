    gmRow({ key:"gm_daily_last_min",   value:"-999999.99",
      cycle:cyc("daily",{hour:23,minute:59}), timerStatus:"disabled" }),

    /* ---- 按周期 · 每周：单个星期 / 7 天全选（长文案） ---- */
    gmRow({ key:"gm_weekly_single",    value:"1",
      cycle:cyc("weekly",{weekdays:[7],hour:8,minute:0}) }),
    gmRow({ key:"gm_weekly_all_days",  value:"7",
      cycle:cyc("weekly",{weekdays:[1,2,3,4,5,6,7],hour:9,minute:30}) }),

    /* ---- 按周期 · 每月：含 31 日（该月无此日自动跳过）/ 多值顿号 ---- */
    gmRow({ key:"gm_monthly_day31",    value:"3",
      cycle:cyc("monthly",{monthDays:[1,31],hour:10,minute:0}) }),
    gmRow({ key:"gm_monthly_multi",    value:"4",
      cycle:cyc("monthly",{monthDays:[5,10,15,20,25],hour:12,minute:0}) }),

    /* ---- 按周期 · 每年：2 月 29 日（非闰年跳过）/ 年末 23:59 ---- */
    gmRow({ key:"gm_yearly_leap_day",  value:"5",
      cycle:cyc("yearly",{yearMonth:2,yearDay:29,hour:6,minute:0}) }),
    gmRow({ key:"gm_yearly_year_end",  value:"6",
      cycle:cyc("yearly",{yearMonth:12,yearDay:31,hour:23,minute:59}), timerStatus:"disabled" }),

    /* ---- 单次执行两种状态：待执行 / 已执行 ---- */
    gmRow({ key:"gm_once_pending",  value:"10", freq:"once",
      once:{ date:"2027-01-01", hour:0, minute:0 }, dateRange:null }),
    gmRow({ key:"gm_once_executed", value:"11", freq:"once",
      once:{ date:"2026-01-01", hour:0, minute:0 }, dateRange:null,
      timerStatus:"executed" }),

    /* ---- 启停两态：列表上这一列是可点的（点一下就能验证日志落笔） ---- */
    gmRow({ key:"gm_toggle_enabled",  value:"13",
      cycle:cyc("daily",{hour:2,minute:0}) }),
    gmRow({ key:"gm_toggle_disabled", value:"14",
      cycle:cyc("daily",{hour:3,minute:0}), timerStatus:"disabled" }),

    /* ---- 布局压力：超长 Key（列宽 / 折行 / title 悬浮） ---- */
    gmRow({ key:"gm_extremely_long_key_for_column_layout_stress_test", value:"16",
      cycle:cyc("daily",{hour:5,minute:0}) })
  ];
}

function demoGm(){
  CLOCK_OFFSET = 0;                 /* 重置模拟时间，否则快进过的演示无法复原 */
  /* 幂等：同一个场景不铺第二遍。这里的 Set 装的是**场景定义里的 key** ——
     GM 场景是代码里写死的清单，key 在那里充当场景名；它不依赖「用户填的 Key 唯一」，
     所以 Key 放开唯一性之后这条依旧成立。 */
  const exist  = new Set(state.list.map(r => r.key));
  const all    = buildGmScenarios();
  const add    = all.filter(r => !exist.has(r.key));
  const skip   = all.length - add.length;

  if (!add.length) {
    toast("覆盖场景已全部存在，未重复添加", "success");
    return;
  }

  const now = Date.now();
  add.forEach((r, i) => {
    r.id = state.nextId++;
    r.createdAt = now + i;
    state.list.push(r);
  });
  confirmCtx = null;   /* 整批追加后语境已变，把可能悬挂的确认上下文作废 */
  resetListFilter();
  renderTable();
  toast("已追加 " + add.length + " 条覆盖场景" + (skip ? "（跳过 " + skip + " 条已存在）" : ""), "success");
}

/* 演示用操作记录：共 8 条，覆盖 add / edit / delete / enable / disable 五类动作
   （add / edit / delete 各 2 条，enable / disable 各 1 条 —— 启停拆成两枚徽标后，
   两个方向都要有样本，否则评审时点不出来）。
   其中 5 个 Key 故意不在 DEMO 列表里 —— 用来现场证明
   「定时器被删了，操作记录还在」（这正是只做全局入口、日志存快照的硬理由）。

   recId = 被操作定时器的 ID。那 5 条孤儿条目（定时器早已被删除，列表里已经查不到）用的是 13–17 ——
   比当前列表的 1–12 大。自增 ID 讲的故事是：现在这 12 条先建（拿到 1–12），
   后来又建的 5 条（13–17）全删掉了，于是它们只剩日志、不见于列表。
   demoLoad 会把 nextId 拨到所有这些 ID 之后（见那里的注释），否则新建的记录会拿到
   一个日志里已经出现过的 ID，唯一标识当场重号。

   每条都带 before / after 配置快照，「查看详情」靠它重建那次动作的对比表。
   其中三条「定时器还在列表里」的条目（recId 1 / 2 / 8）的 after 必须与该记录的
   **当前状态**完全一致 —— 否则点开查看详情会说"变更后是 X"、列表上却是 Y，
   自己跟自己矛盾。wb2-dom 有一条断言专门盯着这个自洽性。 */
function demoLogs(){
  const t0 = Date.now(), m = 60000;
  /* 快照的紧凑写法：mk() 补全默认字段 → cmpSnapshot() 抽出对比表要用的那几个。
     与三个写入点产出的 before / after 是同一形状，因此两边渲染完全一致。 */
  const sn  = o => cmpSnapshot(mk(o));
  const cyc = o => Object.assign(
    { granularity:"daily", weekdays:[], monthDays:[], yearMonth:null, yearDay:null, hour:0, minute:0 }, o || {});

  /* [几分钟前, 动作, recId, before, after] */
  const raw = [
    [8,  "add",     13,
      null,
      sn({ key:"summer_island_boss_hp", value:"5000", cycle: cyc({ hour:4 }),
           dateRange:{ start:"2026-07-01", end:"2026-08-31" } })],

    [7,  "edit",    14,
      sn({ key:"summer_island_drop_rate", value:"0.05", cycle: cyc({ hour:4 }),
           dateRange:{ start:"2026-07-01", end:"2026-08-31" } }),
      sn({ key:"summer_island_drop_rate", value:"0.08", cycle: cyc({ hour:4 }),
           dateRange:{ start:"2026-07-01", end:"2026-08-31" } })],

    [6,  "disable",  2,
      sn({ key:"weekly_rank_reward", value:"100",
           cycle: cyc({ granularity:"weekly", weekdays:[1,3], hour:5 }),
           dateRange:{ start:"2026-09-01", end:"2027-01-31" }, timerStatus:"enabled" }),
      sn({ key:"weekly_rank_reward", value:"100",
           cycle: cyc({ granularity:"weekly", weekdays:[1,3], hour:5 }),
           dateRange:{ start:"2026-09-01", end:"2027-01-31" }, timerStatus:"disabled" })],

    [5,  "delete",  15,
      sn({ key:"summer_island_old_event", value:"1",
           cycle: cyc({ granularity:"yearly", yearMonth:7, yearDay:15 }),
           dateRange:{ start:"2026-07-01", end:"2026-08-31" } }),
      null],

    [4,  "add",     16,
      null,
      sn({ key:"summer_island_login_gift", value:"3", cycle: cyc({ hour:0 }),
           dateRange:{ start:"2026-07-01", end:"2026-08-31" } })],

    [3,  "enable",   8,
      sn({ key:"heartbeat_ping", value:"7", cycle: cyc({ hour:1, minute:30 }),
           dateRange:{ start:"", end:"" }, timerStatus:"disabled" }),
      sn({ key:"heartbeat_ping", value:"7", cycle: cyc({ hour:1, minute:30 }),
           dateRange:{ start:"", end:"" }, timerStatus:"enabled" })],

    [2,  "edit",     1,
      sn({ key:"daily_gift_switch", value:"0", cycle: cyc({ hour:3 }),
           dateRange:{ start:"2026-09-01", end:"2026-12-31" } }),
      sn({ key:"daily_gift_switch", value:"1", cycle: cyc({ hour:3 }),
           dateRange:{ start:"2026-09-01", end:"2026-12-31" } })],

    [1,  "delete",  17,
      sn({ key:"summer_island_removed_key", value:"9",
           cycle: cyc({ granularity:"monthly", monthDays:[1], hour:9 }),
           dateRange:{ start:"2026-07-01", end:"2026-08-31" } }),
      null]
  ];
  return raw.map(x => ({
    id: ++logSeq, ts: t0 - x[0] * m, actor: OPERATOR,
    action: x[1], recId: x[2],
    before: x[3] || null, after: x[4] || null
  }));
}

function demoLoad(){
  CLOCK_OFFSET = 0;                 /* 重置模拟时间，否则快进过的演示无法复原 */
  const now = Date.now();
  state.list = DEMO.map((d, i) => Object.assign(clone(d), { id: i + 1, createdAt: now - i * 60000 }));

  state.logs  = demoLogs();
  /* nextId 要拨到「列表现有 ID」与「日志里出现过的所有 recId」之后。
     演示日志里有 5 条已被删除的历史条目（recId 13–17），它们比列表的 1–12 大 ——
     若 nextId 只取 DEMO.length+1，新建的第一条记录会拿到 13，与日志里那条历史条目重号，
     ID 作为唯一标识当场失效。 */
  state.nextId = state.logs.reduce((m, l) => Math.max(m, (l.recId || 0) + 1), DEMO.length + 1);

  confirmCtx  = null;               /* 演示数据整体替换了语境 */
  resetListFilter();
  renderTable();
  toast("已载入 " + DEMO.length + " 条演示数据", "success");
}

function demoClear(){
  CLOCK_OFFSET = 0;
  state.list = [];
  state.nextId = 1;
  state.logs = [];                  /* 清空列表时日志一并清掉，否则会留下查不到对象的孤儿条目 */
  logSeq = 0;
  confirmCtx = null;
  resetListFilter();
  renderTable();
  toast("已清空列表", "success");
}

/* ---- GM：模拟时间快进（用于演示「待执行 → 到点执行」） ---- */
function advanceClock(days){
  CLOCK_OFFSET += days * 86400000;
  scanOnce();
  renderTable();
}
function demoFastForward(){
  advanceClock(1);
  toast("已把模拟时间快进 1 天", "success");
}

/* ==========================================================================
   12. 事件与初始化
   ========================================================================== */

/* ---- 顶部按钮 ---- */
$("#btnAdd").addEventListener("click", () => openModal(null));

/* ---- 操作记录弹窗（入口按钮无计数、不置灰：日志是查看器，不是待办队列） ---- */
$("#btnLog").addEventListener("click", openLog);

/* ---- 列表筛选：静态控件 → 每次改动重绘表格。
        搜索走 input（边打边筛）；两个下拉走 change；重置一键清空三项。 ---- */
$("#fKeySearch").addEventListener("input", renderTable);
$("#fFreq").addEventListener("change", renderTable);
$("#fStatus").addEventListener("change", renderTable);
$("#fReset").addEventListener("click", () => { resetListFilter(); renderTable(); });
$("#maskLog").addEventListener("click", e => {
  if (e.target.closest("[data-close-log]")) closeLog();
});
$("#maskLog").addEventListener("mousedown", e => { if (e.target === $("#maskLog")) closeLog(); });
$("#logAction").addEventListener("change", renderLog);   /* 操作类型：切换即筛 */

/* ---- 操作详情（只读）：操作记录行内的「查看详情」打开 ----
   按**日志行自身的 id** 反查条目（不是 recId —— recId 指向被操作的定时器，
   可能早已被删，指不回日志上）。用委托是因为日志行每次重绘都是新节点。 */
$("#logRegion").addEventListener("click", e => {
  const btn = e.target.closest("[data-log-id]");
  if (!btn) return;
  openLogView(state.logs.find(x => x.id === Number(btn.dataset.logId)));
});
$("#maskLogView").addEventListener("click", e => {
  if (e.target.closest("[data-close-logview]")) closeLogView();
});
$("#maskLogView").addEventListener("mousedown", e => {
  if (e.target === $("#maskLogView")) closeLogView();
});

/* ---- 演示入口（一键铺覆盖场景 / 载入 / 清空 / 快进模拟时间） ---- */
$("#demoGm").addEventListener("click", demoGm);
$("#demoLoad").addEventListener("click", demoLoad);
$("#demoClear").addEventListener("click", demoClear);
$("#demoFastForward").addEventListener("click", demoFastForward);

/* ---- 列表事件（委托）----
   edit → 打开配置弹窗（保存时再确认）；del / toggle → 直接开确认弹窗 */
$("#tableRegion").addEventListener("click", e => {
  const btn = e.target.closest("[data-act]");
  if (!btn) return;
  const id = Number(btn.dataset.id);
  const act = btn.dataset.act;
  if (act === "edit")         openModal(id);
  else if (act === "del")     deleteTimer(id);
  else if (act === "toggle")  toggleTimer(id);
});

/* ---- 「定时器状态」列头 ⓘ 的悬浮说明 ----
   气泡是 body 下的 fixed 元素（见 4.5b），位置由 ⓘ 的矩形现算。
   离场判断必须看 relatedTarget 是否仍落在 ⓘ 内：mouseover / mouseout 会在
   ⓘ 与它的 svg 子节点之间反复触发，不判 relatedTarget 就会一闪一闪。 */
const thTip = $("#thStatusTip");
let thTipAnchor = null;      /* 气泡当前挂靠的 ⓘ —— 缩放时要拿它重新摆位，滚动则直接收起 */

function placeThTip(btn){
  const r = btn.getBoundingClientRect(), w = thTip.offsetWidth;
  let left = r.left + r.width / 2 - w / 2;
  left = Math.max(12, Math.min(left, window.innerWidth - w - 12));   /* 贴边时收回可视区 */
  thTip.style.left = left + "px";
  thTip.style.top  = (r.bottom + 8) + "px";
}
function showThTip(btn){
  thTipAnchor = btn;
  thTip.hidden = false;                        /* 先显示，才量得到 width */
  placeThTip(btn);
}
function hideThTip(){ thTip.hidden = true; thTipAnchor = null; }
const tipHost = e => (e.target && e.target.closest) ? e.target.closest(".th-info") : null;

$("#tableRegion").addEventListener("mouseover", e => {
  const b = tipHost(e);
  if (b && !b.contains(e.relatedTarget)) showThTip(b);
});
$("#tableRegion").addEventListener("mouseout", e => {
  const b = tipHost(e);
  if (b && !b.contains(e.relatedTarget)) hideThTip();
});
$("#tableRegion").addEventListener("focusin",  e => { const b = tipHost(e); if (b) showThTip(b); });
$("#tableRegion").addEventListener("focusout", e => { const b = tipHost(e); if (b) hideThTip(); });
/* 缩放：重新摆位 —— 气泡是 fixed，不重摆就会与 ⓘ 脱节；ⓘ 已被重绘掉则干脆收起。
   滚动（含表格自身的横向滚动）：直接收起，下次悬停再定位。 */
window.addEventListener("resize", () => {
  if (!thTip.hidden && thTipAnchor && thTipAnchor.isConnected) placeThTip(thTipAnchor);
  else hideThTip();
});
window.addEventListener("scroll", hideThTip, true);

/* ---- 生效前确认弹窗（新增 / 修改 / 删除共用）----
   取消 / 点 ✕ / 点遮罩：只关这一层，回到下面的配置弹窗继续改；关掉后补一次重绘 */
$("#maskConfirm").addEventListener("click", e => {
  if (e.target.closest("[data-close-confirm]")) { closeConfirm(); renderTable(); }
});
$("#maskConfirm").addEventListener("mousedown", e => {
  if (e.target === $("#maskConfirm")) { closeConfirm(); renderTable(); }
});
$("#btnConfirmOk").addEventListener("click", confirmOk);

/* ---- 弹窗：点击（频率 / 粒度 / 多选标签 / 关闭） ---- */
$("#modal").addEventListener("click", e => {
  /* 这里不处理状态：状态不在配置弹窗里改，唯一入口是列表上的状态开关（见上方 HTML 注释） */
  const t = e.target.closest("[data-freq],[data-gran],[data-tag],[data-close]");
  if (!t) return;

  if (t.hasAttribute("data-close")) { closeModal(); return; }

  if (t.dataset.freq) {
    syncFormFromDOM();
    state.form.freq = t.dataset.freq;
    dropErr(["cycleWeek","cycleMonth","cycleYear","time","onceDate","range"]);
    setFreqSeg();
    renderDynamicArea();
    applyErrors();
    renderPreview();
    return;
  }

  if (t.dataset.gran) {
    syncFormFromDOM();
    state.form.cycle.granularity = t.dataset.gran;
    /* 粒度切换：清掉其他粒度的错误，保留已填的值 */
    dropErr(["cycleWeek","cycleMonth","cycleYear","time"]);
    renderDynamicArea();
    applyErrors();
    renderPreview();
    return;
  }

  if (t.dataset.tag) {
    syncFormFromDOM();
    const group = t.dataset.tag;
    const v = Number(t.dataset.val);
    let arr, errKey;
    if (group === "week")  { arr = state.form.cycle.weekdays;  errKey = "cycleWeek"; }
    else                   { arr = state.form.cycle.monthDays; errKey = "cycleMonth"; }

    const i = arr.indexOf(v);
    if (i >= 0) arr.splice(i, 1); else arr.push(v);

    if (errKey) clearErr(errKey);
    renderDynamicArea();   /* 标签选中态随状态重绘 */
    applyErrors();
    renderPreview();
  }
});

/* ---- 弹窗：输入 ---- */
/* 文本 / 数字 / 日期控件的统一处理：只刷新预览文案，不重绘 DOM，避免输入丢焦点 */
function handleFieldInput(el){
  const f = state.form;
  if (!f) return;

  /* radio 不归这里管：它由下面的 change 委托处理。
     原因是 radio 的 input 事件先于 change 到达，那一刻 state.form.rangeMode 还是旧值，
     照旧值渲染会把用户刚展开的日期框又收回去（键盘方向键切换尤其明显）。 */
  if (el.type === "radio") return;

  /* Value：非法字符**不再回退** —— 回退会让「输入框变红」永远看不到，用户只会觉得打不进去。
     实时口径用宽松正则，放行 `-` / `-.` / `1.` 这类输入中间态；命不中的字符就地标红，
     改回合法后立即恢复。提交时另用严格正则兜底（见 validate），异常一律阻拦。 */
  if (el.id === "in-value") {
    f.value = el.value;
    if (el.value === "" || /^-?\d*\.?\d{0,2}$/.test(el.value)) clearErr("value");
    else setFieldErr("value", "Value仅允许数字（支持负数、小数点）");
    renderPreview();
    return;
  }

  if (el.id === "in-key")      { f.key = el.value; clearErr("key"); }
  if (el.id === "in-rstart")   { f.dateRange.start = el.value; clearErr("range"); }
  if (el.id === "in-rend")     { f.dateRange.end   = el.value; clearErr("range"); }
  if (el.id === "in-oncedate") { f.once.date = el.value; clearErr("onceDate"); }

  renderPreview();
}

$("#modal").addEventListener("input", e => handleFieldInput(e.target));

/* ---- 弹窗：下拉 / 日期 / 单选项 ---- */
$("#modal").addEventListener("change", e => {
  const el = e.target;

  /* 生效区间的单选项。切到「始终生效」时把两个日期**当场清空**，
     于是「日期为空 ⟺ 始终生效」恒成立，记录侧不需要再存一个模式字段。
     清空发生在切走的那一刻而不是保存时：用户看得见，也不会有「看不见的值被偷偷提交」。 */
  if (el.name === "rangeMode") {
    const f = state.form;
    if (!f) return;
    f.rangeMode = el.value;
    if (el.value === "always") {
      f.dateRange.start = "";
      f.dateRange.end   = "";
      const s = $("#in-rstart"), en = $("#in-rend");
      if (s)  s.value  = "";
      if (en) en.value = "";
    }
    syncRangePicker();
    clearErr("range");
    renderPreview();
    return;
  }

  if (el.tagName !== "SELECT") { handleFieldInput(el); return; }   /* 日期控件 */

  syncFormFromDOM();
  if (el.id === "in-hour" || el.id === "in-min" ||
      el.id === "in-oncehour" || el.id === "in-oncemin") clearErr("time");
  if (el.id === "in-ym" || el.id === "in-yd") clearErr("cycleYear");
  renderPreview();
});

/* ---- 弹窗：保存 / 遮罩关闭 / ESC ---- */
$("#btnSave").addEventListener("click", onSave);
$("#mask").addEventListener("mousedown", e => { if (e.target === $("#mask")) closeModal(); });
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  /* 层级最内层优先：确认弹窗 > 操作记录 > 配置弹窗。
     取消确认弹窗后补一次重绘 —— 弹窗期间扫描可能已经翻过状态。 */
  if (!$("#maskLogView").hidden) { closeLogView(); return; }   /* 操作详情最内层 */
  if (!$("#maskConfirm").hidden) { closeConfirm(); renderTable(); return; }
  if (!$("#maskLog").hidden)     { closeLog(); return; }
  if (!$("#mask").hidden) closeModal();
});

/* ---- 初始化：默认空态 ---- */
renderTable();

/* 每秒扫一次到点状态；只在真有变化时重绘，避免打断悬停 / 滚动。
   确认弹窗开着时跳过 —— 它遮住了列表，而重绘会让「定时器状态」这类字段在对比时漂移。 */
if (!IS_TEST_ENV) setInterval(() => {
  if (!$("#maskConfirm").hidden) return;
  if (scanOnce()) renderTable();
}, 1000);
</script>
